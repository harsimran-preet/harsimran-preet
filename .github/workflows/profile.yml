name: Refresh profile

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build SVGs
        env:
          # Username is never hardcoded: it comes from the repo owner.
          GH_USER: ${{ github.repository_owner }}
          # Prefer a classic PAT with read:user (secret GH_READ_USER); fall back
          # to the built-in GITHUB_TOKEN (fine for public contribution counts).
          GH_TOKEN: ${{ secrets.GH_READ_USER || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_ascii.py     portrait.svg
          python scripts/build_heatmap.py   heatmap.svg
          python scripts/build_info_card.py info-card.svg

      - name: Commit regenerated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Guard: with no staged changes the commit would fail and turn the run
          # red every day nothing changed. Exit 0 instead so the Action stays green.
          if git diff --quiet --cached; then
            echo "No changes - nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile SVGs [skip ci]"
          git push
