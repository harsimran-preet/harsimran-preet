name: Update profile art

# Refreshes the contribution graph SVG daily from real data (GitHub GraphQL).
# Runs daily, on push to main, and on demand.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # username is never hardcoded: it comes from the repo owner, passed via env
      - name: Scrape contribution stats (best-effort)
        continue-on-error: true
        env:
          GH_PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}     # reads the PUBLIC calendar via GraphQL
        run: python scripts/generate_streak_svg.py "$GH_USER" contrib-heatmap.svg

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
